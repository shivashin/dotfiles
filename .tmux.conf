# 色周りの設定
set -g default-terminal "screen-256color"
set -g terminal-overrides 'xterm:colors=256'

# prefixキーをC-aに変更する
set -g prefix C-a

# C-bのキーバインドを解除する
unbind C-b

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-a*2でtmux内のプログラムにC-aを送る
bind C-a send-prefix

# | でペインを縦に分割する
bind | split-window -h

# - でペインを横に分割する
bind - split-window -v

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# マウス操作を有効にする
setw -g mouse on

# ステータスバーの色を設定する
set -g status-style fg=white,bg=blue

# ウィンドウリストの色を設定する
setw -g window-status-style fg=cyan,bg=default,dim
# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg=white,bg=red,bright

# ペインボーダーの色を設定する
set -g pane-border-style fg=green,bg=black

# アクティブなペインを目立たせる
set -g pane-active-border-style fg=white,bg=yellow

# コマンドラインの色を設定する
set -g message-style fg=white,bg=black,bright

# ステータスバーを設定する
## 左パネルを設定する
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 60
## ウィンドウリストの位置を中心寄せにする
set -g status-justify centre
## ヴィジュアルノーティフィケーションを有効にする
setw -g monitor-activity on
set -g visual-activity on
## ステータスバーを上部に表示する
set -g status-position top

# コピーモードを設定する
## viのキーバインドを使用する
setw -g mode-keys vi
## クリップボートとの連携
## macOS は pbcopy に渡す。Linux（主に SSH 先）は OSC 52 で手元のターミナルのクリップボードに送る
## @override_copy_command は tmux-yank が y とマウスのドラッグに使うコマンド
set -s set-clipboard on
if-shell '[ "$(uname)" = Darwin ]' {
  set -s copy-command 'pbcopy'
  set -g @override_copy_command 'pbcopy'
} {
  # tmux が set-clipboard で OSC 52 を送るので、tmux-yank 側では何もしない
  set -g @override_copy_command 'cat > /dev/null'
}
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T root DoubleClick1Pane select-pane \; copy-mode \; send-keys -X select-word \; run -d0.2 \; send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run -d0.2 \; send-keys -X copy-pipe-and-cancel
bind-key -T root TripleClick1Pane select-pane \; copy-mode \; send-keys -X select-line \; run -d0.2 \; send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run -d0.2 \; send-keys -X copy-pipe-and-cancel

# メモリ使用量，CPU利用率グラフ，割合，ロードアベレージ
set -g status-interval 2
set -g status-right-length 100
set -g status-right "#[bg=blue] #(tmux-mem-cpu-load -a 3)  %m/%d/%Y %H:%M "

# plugin
# バージョン（コミット）は tmux/plugins.lock で固定し、~/dotfiles/tmux-plugins.sh で入れる。
# ここに足したり消したりしたら、plugins.lock も同じように直す（CI で一致を確認する）
set -g @tpm_plugins '              \
  tmux-plugins/tpm                 \
  tmux-plugins/tmux-sensible       \
  tmux-plugins/tmux-yank           \
  tmux-plugins/tmux-open           \
  tmux-plugins/tmux-resurrect      \
  tmux-plugins/tmux-continuum      \
  wfxr/tmux-fzf-url                \
  sainnhe/tmux-fzf                 \
'

# 再起動時にtmuxのセッションを自動で復元する設定
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# FZFでpaneやwindowでswitchするための設定
# NOTE: fzf 内は 起動時はノーマルモード (j/k/g/G/q)、i か / で入力モード、Esc でノーマルに戻る
FZF_VIM_BINDS="--prompt='N> ' --bind='j:down,k:up,g:first,G:last,q:abort' --bind='i:unbind(j,k,g,G,q,i,/)+change-prompt(> )' --bind='/:unbind(j,k,g,G,q,i,/)+change-prompt(> )' --bind='esc:rebind(j,k,g,G,q,i,/)+change-prompt(N> )'"
TMUX_FZF_OPTIONS="-p -w 80% -h 80% --reverse --bind='ctrl-/:toggle-preview' --preview-window=right,60% $FZF_VIM_BINDS"
TMUX_FZF_PREVIEW=1
TMUX_FZF_WINDOW_FORMAT="#{window_name}  #{pane_current_command}  #{b:pane_current_path}#{?window_active, *,}"
TMUX_FZF_PANE_FORMAT="[#{window_name}] #{pane_current_command}  #{b:pane_current_path}#{?pane_active, [active],}"
bind-key "space" run-shell -b "${HOME}/.tmux/plugins/tmux-fzf/scripts/pane.sh switch"
bind-key "N" display-popup -E -w 80% -h 80% "${HOME}/dotfiles/tmux-new-session-fzf.sh"

run-shell '~/.tmux/plugins/tpm/tpm'

# tpm の prefix + I（インストール）と prefix + U（更新）は、plugins.lock を無視して最新のコミットを入れてしまう。
# tpm を読み込んだあとで、plugins.lock のとおりに入れるスクリプトに置き換える
bind-key I run-shell "~/dotfiles/tmux-plugins.sh install"
bind-key U display-message "プラグインの更新は ~/dotfiles/tmux-plugins.sh update で行う"
