name: CI

on:
  pull_request:
  push:
    branches: [master]

# 必要なジョブだけ個別に権限を足す
permissions:
  contents: read # リポジトリを読むだけにする

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # シェルスクリプトと設定ファイルの文法チェック（Linux）
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zsh と tmux を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh tmux

      - name: shellcheck
        run: shellcheck ./*.sh .github/scripts/*.sh .githooks/*

      - name: .zshrc の文法チェック
        run: zsh -n .zshrc

      - name: .tmux.conf の文法チェック
        run: tmux -f /dev/null start-server \; source-file -n .tmux.conf

  # シェルスクリプトと設定ファイルの文法チェック（macOS）
  # brew bundle で .Brewfile を全部入れると時間がかかりすぎるので、setup.sh は実行しない
  lint-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tmux を入れる
        run: brew install tmux

      - name: シェルスクリプトの文法チェック
        run: for f in ./*.sh .github/scripts/*.sh .githooks/*; do bash -n "$f"; done

      - name: .zshrc の文法チェック
        run: zsh -n .zshrc

      - name: .tmux.conf の文法チェック
        run: tmux -f /dev/null start-server \; source-file -n .tmux.conf

      # インストールはせず、.Brewfile の中身が Homebrew でまだ配布されているかだけを調べる
      - name: .Brewfile の確認
        run: .github/scripts/check-brewfile.sh .Brewfile

  # GitHub Actions の workflow の文法とセキュリティを調べる
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint は GitHub Action として配布されていないので、リリースのバイナリをチェックサムを確かめて使う。
      # バージョンを上げるときは、リリースの actionlint_<version>_checksums.txt から linux_amd64 の値に変える
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # 結果はログに出す。Advanced Security（Security タブ）には送らない
          advanced-security: false

  # コミットに秘密情報が含まれていないかを調べる
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # 履歴を読む
      pull-requests: read # PR に含まれるコミットの一覧を取得する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 結果はジョブのログとサマリーで見る。PR へのコメントと、検出内容を含むファイルのアップロードはしない
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Linux のコンテナで setup.sh を実行する
  setup-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "amazonlinux:2023"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup.sh を確認する（${{ matrix.image }}）
        # ${{ }} を run の中に直接書かず、環境変数で渡す
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$GITHUB_WORKSPACE":/src:ro "$IMAGE" bash /src/.github/scripts/test-setup-linux.sh
